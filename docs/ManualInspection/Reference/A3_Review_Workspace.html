<header class="app-header"><div><span class="eyebrow">A3 / REVIEW WORKSPACE</span><h1>리뷰 작업공간</h1><p>지도에서 선택하고, 이동·측정·보정을 한 곳에서 진행하세요.</p></div><div class="header-actions"><label>예제<select id="demo-select"><option value="normal">혼합 결과 · NG/미측정</option><option value="good">정상 측정 결과</option><option value="stress">10,000점</option></select></label><button type="button" class="btn" data-action="load-demo">예제 열기</button><button type="button" class="btn" data-action="session-download">세션 JSON 저장</button><span class="badge pending">SIM · 설비 미연결</span></div></header>

<script>(function (global) {

  const number = (value, label) => {
    if (value === null || value === undefined || typeof value === 'boolean' || String(value).trim() === '' || !Number.isFinite(Number(value))) throw new Error(`${label}: 빈 값이나 유효하지 않은 숫자는 사용할 수 없습니다.`);

  };

  const identity = p => `C${String(p.cell).padStart(2, '0')}/H${String(p.head).padStart(2, '0')}/S${p.shot}/B${String(p.beam).padStart(2, '0')}`;

  function parseCSV(text) {

document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&$('detail-dialog').open){closeDialog();return}if(ev.key==='Escape'&&busy()){ev.preventDefault();stopOperation()}});
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>ReviewWorkspace.draw(E,ui,api()),100)});
function copyGuard(){guardIdle();if(incomplete())throw Error('중지·오류로 남은 측정점을 먼저 완료하거나 새 예제를 여세요.');if(E.state.importInfo?.lineage===false||E.state.importInfo?.recipeMismatch)throw Error('조회 전용 자료는 보정할 수 없습니다.');}
function copyContext(){
 const ref=point(ui.rw?.representativeKey);if(!ReviewWorkspace.eligible(ref))throw Error('직접 측정한 OK 또는 NG 점을 대표값으로 지정하세요. 복사본은 대표점으로 사용할 수 없습니다.');
 if(ref.raw?.measurementRunId!==E.state.runId||ref.raw?.recipeId!==E.state.recipeId)throw Error('대표 원측정의 Run·Recipe가 현재와 다릅니다.');
 const requested=[...ui.selected].filter(k=>k!==ref.key);if(!requested.length)throw Error('대표점 이외에 상태와 오프셋을 복사할 대상을 선택하세요.');
 if(requested.some(k=>!point(k)))throw Error('자료에 없는 선택점이 있습니다.');
 const excluded=requested.filter(k=>point(k).masked),keys=requested.filter(k=>!point(k).masked);if(!keys.length)throw Error('선택 대상이 모두 Masking 영역입니다.');
 const c=E.state.candidate,editing=!!c&&c.status!=='APPLIED';if(editing)guardCandidateBase(c);
 const row=editing?c.rows.find(r=>r.key===ref.key):null,b=active().values[ref.key]||{x:0,y:0};
 const x=row?row.finalX:b.x+ref.errorXUm,y=row?row.finalY:b.y+ref.errorYUm;if(!Number.isFinite(x)||!Number.isFinite(y))throw Error('대표 보정값이 올바르지 않습니다.');
 return{refKey:ref.key,keys,excluded,x,y,judge:ref.judge,errorXUm:ref.errorXUm,errorYUm:ref.errorYUm,editing,fingerprint:JSON.stringify({source:sourceFingerprint(),candidate:c,selection:[...ui.selected].sort(),refKey:ref.key,x,y})};
}
function copyPreview(){try{
 copyGuard();const q=copyContext();ui.pendingCopy=q;
 const rows=q.keys.slice(0,10).map(k=>{const p=point(k),b=active().values[k]||{x:0,y:0};return`<tr><td>${h(k)}</td><td>${h(p.judge)} → <b>${h(q.judge)}</b></td><td>${sign(p.errorXUm)} / ${sign(p.errorYUm)} → ${sign(q.errorXUm)} / ${sign(q.errorYUm)}</td><td>${sign(q.x,3)} / ${sign(q.y,3)}</td><td>${sign(q.x-b.x,3)} / ${sign(q.y-b.y,3)}</td></tr>`}).join('');
 showDialog('대표 상태와 오프셋을 함께 복사',`<div id="copy-preview"><p>대표 <b>${h(q.refKey)}</b> → 대상 <b>${q.keys.length}점</b>${q.excluded.length?` · Masking ${q.excluded.length}점 제외`:''}</p><div class="copy-value">작업판정 <b class="${q.judge==='OK'?'pass':'fail'}">${h(q.judge)}</b> · 최종 F <b>${sign(q.x,3)} / ${sign(q.y,3)} µm</b></div><p>선택 위치의 작업 편차와 판정도 대표값을 따릅니다. 원측정 기록은 별도로 남고, 복사 결과는 <b>대표값 복사 · MANUAL</b>로 표시합니다.</p><div class="table-wrap"><table><thead><tr><th>대상</th><th>작업판정</th><th>작업편차 X/Y · µm</th><th>같은 최종 F · µm</th><th>점별 증감 Δ · µm</th></tr></thead><tbody>${rows}</tbody></table></div>${q.keys.length>10?`<p class="small">처음 10점 / 전체 ${q.keys.length}점</p>`:''}<p class="note">${q.editing?'기존 미적용 후보를 보존하면서 선택 대상만 변경합니다.':'선택 대상만 포함하는 새 수동 후보를 만듭니다.'} 대표점 자체는 복사 대상에서 제외합니다. ${q.judge==='NG'?'대표가 NG이므로 대상도 NG입니다. 상태 복사 후에도 NG는 검증·적용을 통과하지 못합니다.':'화면의 OK는 대표를 따른 작업판정이며 새 직접 측정이 아닙니다.'} 활성 보정은 이 화면의 검증·적용에서 저장합니다.</p><details><summary>복사 사유</summary><label class="field">기록할 사유<input id="copy-reason" value="사용자가 지정한 대표 상태와 최종 오프셋 동일 반영"></label></details><div class="toolbar section-gap">${btn('copy-confirm',`${q.keys.length}점 상태·후보에 반영`,'primary')}${btn('close-dialog','취소')}</div></div>`);
 }catch(e){announce(e.message,'error');}}
function copyConfirm(){
 copyGuard();const old=ui.pendingCopy;if(!old)throw Error('복사 내용을 먼저 확인하세요.');const q=copyContext();if(q.fingerprint!==old.fingerprint)throw Error('검토 중 측정·선택·보정 기준이 바뀌었습니다. 다시 검토하세요.');
 const reason=value('copy-reason').trim();if(!reason)throw Error('복사 사유를 입력하세요.');
 const before=clone(E.state.candidate),pointsBefore=Object.fromEntries(q.keys.map(k=>[k,clone(point(k))])),logsBefore=E.state.logs.slice();
 try{
  if(!q.editing)E.makeCandidate({mode:'SIMPLE',keys:q.keys,simpleX:0,simpleY:0,reason});else{E.state.candidate=clone(E.state.candidate);const c=E.state.candidate,present=new Set(c.rows.map(r=>r.key));q.keys.filter(k=>!present.has(k)).forEach(k=>c.rows.push(baseRow(point(k))));}
  const at=now();for(const k of q.keys){const p=point(k);p.copyHistory||(p.copyHistory=[]);p.copyHistory.push({at,before:workingSnapshot(p),referenceKey:q.refKey,reason});p.originalMeasurement||=measurementSnapshot(p);p.errorXUm=q.errorXUm;p.errorYUm=q.errorYUm;p.judge=q.judge;p.source='MANUAL';p.proxySource={referenceKey:q.refKey,referenceJudge:q.judge,referenceErrorXUm:q.errorXUm,referenceErrorYUm:q.errorYUm,finalX:q.x,finalY:q.y,at,reason,runId:E.state.runId};}
  E.editCandidate(q.keys,{x:q.x,y:q.y,kind:'absolute',reason:reason+' · 대표 '+q.refKey});
  const c=E.state.candidate,set=new Set(q.keys);for(const r of c.rows)if(set.has(r.key)){r.anchors=[];r.referenceKey=q.refKey;r.method='REFERENCE_COPY';r.manualKind='REFERENCE_COPY';delete r.measurementToken;}
  c.sourceFingerprint=sourceFingerprint(c.rows.map(r=>r.key));E.log('REFERENCE_STATE_COPY','대표 F·작업편차·판정 복사; 원측정 보존',undefined,{referenceKey:q.refKey,keys:q.keys,judge:q.judge,x:q.x,y:q.y,reason});
  ui.rwCopyUndo={before,pointsBefore,afterCandidate:JSON.stringify(c),afterSource:sourceFingerprint(),runId:E.state.runId,revision:E.state.activeRevisionId};ui.pendingCopy=null;ui.allowManual=true;E.save();closeDialog();announce(`${q.keys.length}점의 작업판정·편차·오프셋을 대표값으로 맞췄습니다. 원측정은 보존했습니다.`,'success');render();
 }catch(e){E.state.candidate=before;for(const [k,p]of Object.entries(pointsBefore)){const i=E.state.points.findIndex(x=>x.key===k);E.state.points[i]=p;}E.state.logs=logsBefore;E.save();throw e;}
}
function copyUndo(){try{
 copyGuard();const u=ui.rwCopyUndo;if(!u)throw Error('되돌릴 대표 복사가 없습니다.');
 if(u.runId!==E.state.runId||u.revision!==E.state.activeRevisionId||u.afterCandidate!==JSON.stringify(E.state.candidate)||u.afterSource!==sourceFingerprint())throw Error('복사 뒤 측정·설정·후보·활성 보정이 바뀌었습니다. 간편 되돌리기를 차단했습니다.');
 E.state.candidate=u.before;for(const[k,p]of Object.entries(u.pointsBefore)){const i=E.state.points.findIndex(x=>x.key===k);E.state.points[i]=p;}ui.rwCopyUndo=null;E.log('REFERENCE_COPY_UNDO','직전 상태·오프셋 복사를 되돌림');E.save();announce('직전 복사를 되돌려 작업판정·편차·후보를 복원했습니다.','success');render();
 }catch(e){announce(e.message,'error');}}

initializePoints();initRuntime();if(E.state.operationIncomplete?.remainingKeys?.length)announce('이전 작업의 남은 측정점이 있습니다. 잔여 재실행하거나 새 예제를 여세요.','error');else if(ui.restoreWarning)announce(ui.restoreWarning,'error');render();E.save();
})();
</script></body></html>
